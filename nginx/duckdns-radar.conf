# ==========================================================
#  Crypto Radar - servido en su propio subdominio de DuckDNS
#
#  QUE HACE ESTO
#  Da al panel una direccion fija y con HTTPS de verdad, en vez del tunel
#  temporal cuya direccion cambiaba en cada reinicio.
#
#  Sigue exactamente el mismo patron que ya funciona en esta maquina para
#  edwin-iot-server.duckdns.org, incluido el certificado de Let's Encrypt.
#
#  COMO SE USA
#  Estos dos bloques se pegan dentro de la seccion http { } de
#  C:\nginx\conf\nginx.conf, junto a los que ya hay.
#
#  ANTES HACEN FALTA DOS COSAS:
#    1. Crear el subdominio en duckdns.org apuntando a 169.58.161.228
#    2. Pedir el certificado con simple-acme (ver instrucciones abajo)
# ==========================================================

# --- HTTP: solo para renovar el certificado y mandar todo a HTTPS ---------
server {
    listen       80;
    server_name  crypto-radar.duckdns.org;

    # Let's Encrypt deja aqui su fichero de comprobacion al renovar.
    # Tiene que ir ANTES del redirect, o la renovacion falla.
    location /.well-known/acme-challenge/ {
        root C:/nginx/html/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: el panel ------------------------------------------------------
server {
    listen       443 ssl;
    http2        on;
    server_name  crypto-radar.duckdns.org;

    ssl_certificate      C:/Users/Administrator/Documents/Blockchain/nginx/ssl/crypto-radar-fullchain.pem;
    ssl_certificate_key  C:/Users/Administrator/Documents/Blockchain/nginx/ssl/crypto-radar-key.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:SSL:10m;

    # El panel maneja una contrasena: sin esto viajaria en claro.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "no-referrer" always;

    # No queremos que el panel aparezca en buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Limite de intentos de acceso, para que nadie pruebe contrasenas a lo
    # bruto. La zona se declara una sola vez, mas abajo.
    location = /entrar {
        limit_req zone=radar_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include    C:/Users/Administrator/Documents/Blockchain/nginx/proxy_params_radar.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include    C:/Users/Administrator/Documents/Blockchain/nginx/proxy_params_radar.conf;
    }
}

# ==========================================================
#  ESTA LINEA VA APARTE, dentro de http { } pero FUERA de los server { }:
#
#      limit_req_zone $binary_remote_addr zone=radar_login:10m rate=12r/m;
#
#  Si ya existe una zona con ese nombre, no se repite.
# ==========================================================

# ==========================================================
#  PASOS PARA DEJARLO FUNCIONANDO
#
#  1. En duckdns.org (ya tienes cuenta), crear el subdominio:
#         crypto-radar        ->  169.58.161.228
#
#  2. Pedir el certificado. simple-acme ya esta instalado:
#         C:\ProgramData\simple-acme\...\wacs.exe
#     Modo manual, dominio crypto-radar.duckdns.org, validacion por
#     fichero en C:\nginx\html\acme, y guardar los .pem en
#     C:\nginx\conf\ssl\
#
#  3. Pegar los dos bloques de arriba en C:\nginx\conf\nginx.conf
#
#  4. Comprobar y recargar:
#         C:\nginx\nginx.exe -t
#         C:\nginx\nginx.exe -s reload
# ==========================================================
