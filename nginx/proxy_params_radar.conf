# Cabeceras que necesita la aplicacion para saber quien esta llamando de verdad.
# Sin X-Forwarded-For, todos los intentos de acceso aparecerian en el registro
# como si vinieran del propio nginx.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

proxy_connect_timeout 10s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Si la aplicacion se esta reiniciando, devolver un error claro y rapido
# en vez de dejar la peticion colgada.
proxy_next_upstream error timeout http_502 http_503 http_504;
