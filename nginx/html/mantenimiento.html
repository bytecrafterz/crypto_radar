<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Radar</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:24px;text-align:center}
  .caja{max-width:420px}
  h1{font-size:20px;margin:0 0 10px;font-weight:600}
  p{margin:0 0 8px;color:#9198a1}
  .punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d29922;
         margin-right:8px;animation:late 1.4s ease-in-out infinite}
  @keyframes late{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
  <div class="caja">
    <h1><span class="punto"></span>El radar se esta reiniciando</h1>
    <p>Vuelve a estar disponible en unos segundos.</p>
    <p>La deteccion y las alertas no se han detenido: solo el panel esta un momento fuera.</p>
  </div>
</body>
</html>
