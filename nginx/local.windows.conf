# ==========================================================
#  Crypto Radar - Nginx en Windows, para probar en tu PC
#
#  El panel corre en el puerto 3000 y nginx lo publica en el 8080
#  (los puertos 80 y 443 suelen estar ocupados en Windows).
#
#  Arrancar:  C:\tools\nginx-1.28.0\nginx.exe -c RUTA-A-ESTE-FICHERO
# ==========================================================

worker_processes  1;

events {
    worker_connections  256;
}

http {
    # No hace falta incluir mime.types: nginx aqui solo hace de intermediario,
    # no sirve ficheros propios. Ademas ese include se resuelve respecto a la
    # carpeta del fichero de configuracion, no respecto a la de nginx, y daria
    # error al tener la configuracion dentro del proyecto.
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=login_local:5m rate=10r/m;

    upstream radar_local {
        server 127.0.0.1:3000;
        keepalive 8;
    }

    server {
        # Solo escucha en local. Antes aceptaba conexiones de todo internet
        # sirviendo el panel por HTTP sin cifrar, con la contrasena viajando
        # en claro. Ahora el acceso publico va por 8443 con TLS; este 8080
        # queda para el tunel y para pruebas desde la propia maquina.
        listen       127.0.0.1:8080;
        server_name  localhost;

        client_max_body_size 64k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;

        gzip on;
        gzip_types text/plain text/css application/json image/svg+xml;

        location = /entrar {
            limit_req zone=login_local burst=5 nodelay;
            # 429 es el codigo correcto para "demasiadas peticiones".
            # Por defecto nginx devuelve 503, que significa otra cosa.
            limit_req_status 429;
            proxy_pass http://radar_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        location / {
            proxy_pass http://radar_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 30s;
        }
    }

    # ------------------------------------------------------------------
    #  HTTPS en el puerto 8443
    #
    #  POR QUE 8443 Y NO 443
    #  El 443 lo ocupa el otro nginx (el del proyecto IOT), que corre
    #  elevado y no se puede parar desde aqui. 8443 es el puerto
    #  alternativo habitual para HTTPS y no necesita permisos especiales.
    #
    #  El certificado es de Let's Encrypt, obtenido por validacion DNS a
    #  traves de DuckDNS, asi que no hizo falta el puerto 80.
    # ------------------------------------------------------------------
    server {
        listen       127.0.0.1:8443 ssl;
        server_name  crypto-radar.duckdns.org;

        ssl_certificate      C:/Users/Administrator/Documents/Blockchain/nginx/ssl/crypto-radar-fullchain.pem;
        ssl_certificate_key  C:/Users/Administrator/Documents/Blockchain/nginx/ssl/crypto-radar-key.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSLradar:10m;
        ssl_session_timeout  10m;

        client_max_body_size 64k;

        # La contrasena del panel viaja por aqui: conviene que el navegador
        # no acepte volver a la version sin cifrar.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY"    always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header X-Robots-Tag              "noindex, nofollow" always;

        gzip on;
        gzip_types text/plain text/css application/json image/svg+xml;

        location = /entrar {
            limit_req zone=login_local burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://radar_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection        "";
        }

        location / {
            proxy_pass http://radar_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection        "";
        }
    }
}

