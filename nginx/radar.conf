# ==========================================================
#  Crypto Radar - configuracion de Nginx (servidor)
#
#  Nginx va delante del panel: recibe las peticiones de fuera y se las pasa
#  a la aplicacion, que solo escucha en local. Asi el puerto 3000 deja de
#  estar expuesto a internet.
#
#  Se usa con el perfil "nginx" de docker compose:
#      docker compose --profile nginx up -d
# ==========================================================

# Limite de intentos de acceso: el panel es de una sola persona, nadie
# necesita 100 intentos por minuto. Frena los ataques de fuerza bruta.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

# Ocultar la version de nginx en las cabeceras.
server_tokens off;

upstream radar_app {
    # "radar" es el nombre del servicio en docker-compose.
    server radar:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Tamano maximo de peticion: el panel solo recibe formularios diminutos.
    client_max_body_size 64k;

    # Cabeceras de seguridad.
    add_header X-Content-Type-Options   "nosniff"      always;
    add_header X-Frame-Options          "DENY"         always;
    add_header Referrer-Policy          "no-referrer"  always;
    add_header Content-Security-Policy  "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Comprimir: las paginas son HTML generado, comprime muy bien.
    gzip on;
    gzip_types text/plain text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Registro
    access_log /var/log/nginx/radar-access.log;
    error_log  /var/log/nginx/radar-error.log warn;

    # --- Formulario de acceso: limite estricto ---------------------------
    location = /entrar {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://radar_app;
        include /etc/nginx/proxy_params_radar.conf;
    }

    # --- Comprobacion de salud: sin limite ni registro --------------------
    location = /salud {
        access_log off;
        proxy_pass http://radar_app;
        include /etc/nginx/proxy_params_radar.conf;
    }

    # --- Todo lo demas ----------------------------------------------------
    location / {
        limit_req zone=general burst=40 nodelay;

        proxy_pass http://radar_app;
        include /etc/nginx/proxy_params_radar.conf;
    }
}
