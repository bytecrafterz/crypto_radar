# ==========================================================
#  SCORING - como se calculan la oportunidad y el riesgo
#
#  Hay DOS notas independientes, de 0 a 100:
#    - riesgo      : cuanto peligro tiene el token (100 = maximo peligro)
#    - oportunidad : cuanto interes tiene el token (100 = maximo interes)
#
#  Cada regla que se cumple suma sus puntos y deja escrito su motivo,
#  que es lo que ves explicado en la alerta y en el panel.
#
#  Para dar mas o menos importancia a algo, cambia su "points".
#  Para desactivar una regla, pon "enabled: false".
# ==========================================================

# Si el riesgo supera este valor, el token se marca como PELIGRO
# y no se envia como oportunidad aunque puntue alto.
risk_veto_threshold: 75

# Etiquetas segun el riesgo final.
risk_labels:
  - { max: 20, label: "BAJO" }
  - { max: 45, label: "MEDIO" }
  - { max: 70, label: "ALTO" }
  - { max: 100, label: "CRITICO" }

# Etiquetas segun la oportunidad final.
opportunity_labels:
  - { max: 39, label: "DESCARTADO" }
  - { max: 54, label: "OBSERVAR" }
  - { max: 69, label: "INTERESANTE" }
  - { max: 84, label: "FUERTE" }
  - { max: 100, label: "MUY FUERTE" }

# --------------------------------------------------------------------------
#  REGLAS DE RIESGO  (suman peligro)
# --------------------------------------------------------------------------
risk:
  mint_authority_active:
    enabled: true
    points: 30
    reason: "El creador todavia puede emitir mas tokens (mint authority activa)."

  freeze_authority_active:
    enabled: true
    points: 25
    reason: "El creador puede congelar tus tokens (freeze authority activa)."

  token2022_extensions:
    enabled: true
    points: 12
    reason: "Token-2022 con extensiones: puede llevar comisiones o delegado permanente."

  lp_not_locked:
    enabled: true
    points: 25
    reason: "La liquidez no esta bloqueada ni quemada: se puede retirar en cualquier momento."

  lp_partially_locked:
    enabled: true
    points: 10
    threshold_pct: 80   # menos de este % bloqueado/quemado se considera parcial
    reason: "Solo una parte de la liquidez esta bloqueada o quemada."

  owner_can_modify:
    enabled: true
    points: 25
    reason: "El contrato conserva funciones de owner (puede cambiar comisiones o permisos)."

  blacklist_function:
    enabled: true
    points: 30
    reason: "El contrato puede bloquear direcciones (blacklist): podrian impedirte vender."

  high_or_mutable_tax:
    enabled: true
    points: 20
    tax_warn_pct: 10
    reason: "Comisiones de compra/venta altas o modificables por el creador."

  honeypot:
    enabled: true
    points: 60
    reason: "Deteccion de honeypot: se puede comprar pero no vender."

  proxy_contract:
    enabled: true
    points: 15
    reason: "Contrato proxy: el codigo se puede sustituir despues del lanzamiento."

  not_verified:
    enabled: true
    points: 10
    reason: "El contrato no esta verificado, no se puede revisar su codigo."

  top10_concentration:
    enabled: true
    points: 25
    warn_pct: 45        # a partir de aqui empieza a sumar
    max_pct: 80         # aqui suma el maximo de puntos
    reason: "Las 10 mayores wallets concentran demasiado suministro."

  single_holder_dominant:
    enabled: true
    points: 20
    warn_pct: 15
    reason: "Una sola wallet (sin contar pool ni quemado) tiene una parte muy grande."

  deployer_holds:
    enabled: true
    points: 20
    warn_pct: 5
    reason: "El creador conserva una parte importante del suministro."

  deployer_bad_history:
    enabled: true
    points: 35
    reason: "El creador ya lanzo antes tokens que acabaron mal."

  deployer_serial:
    enabled: true
    points: 15
    min_tokens: 4
    reason: "El creador lanza tokens en serie (patron de fabrica de tokens)."

  low_liquidity:
    enabled: true
    points: 20
    floor_usd: 8000
    reason: "Liquidez muy baja: cualquier venta mueve mucho el precio."

  liquidity_removed:
    enabled: true
    points: 45
    reason: "Se ha retirado liquidez del pool."

  sniper_cluster:
    enabled: true
    points: 20
    reason: "Varias wallets compraron en el mismo bloque, patron de bots o compra coordinada."

  wash_trading:
    enabled: true
    points: 25
    reason: "Operaciones repetidas entre las mismas direcciones: posible volumen inflado."

  volume_without_holders:
    enabled: true
    points: 20
    reason: "Mucho volumen pero casi no crecen los holders: volumen probablemente artificial."

  sell_pressure_extreme:
    enabled: true
    points: 15
