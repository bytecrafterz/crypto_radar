# --------------------------------------------------------------------------
#  CONTEXTO DE MERCADO
#
#  El mismo movimiento no significa lo mismo con el mercado subiendo que
#  cayendo. Se mide con SOL y ETH (24 h y 6 h) y se ajusta la exigencia.
# --------------------------------------------------------------------------
market_context:
  enabled: true

  # Multiplicador aplicado a la nota de oportunidad segun el estado general.
  # Con el mercado fuerte se exige un poco mas, porque parte de la subida del
  # token es simplemente marea general y no merito suyo.
  factor_mercado_fuerte: 0.92
  factor_mercado_neutral: 1.00
  factor_mercado_debil: 0.90

  # Puntos de riesgo anadidos cuando el mercado general esta cayendo:
  # un token nuevo remando a contracorriente tiene mas papeletas de fallar.
  riesgo_mercado_debil: 10

  # Puntos de oportunidad si el token sube claramente MAS que el mercado.
  # Es fuerza relativa: separa lo que sube por si mismo de lo que sube
  # porque esta subiendo todo.
  bonus_fuerza_relativa: 12
  # Cuantos puntos porcentuales debe superar al mercado para contar.
  fuerza_relativa_min_pct: 10

# --------------------------------------------------------------------------
#  VETOS CRITICOS
#
#  Estas condiciones BLOQUEAN el token pase lo que pase. No suman puntos de
#  riesgo que luego puedan compensarse con oportunidad: vetan directamente.
#  Un contrato del que no se puede salir no es "menos buena oportunidad":
#  no es una oportunidad.
#
#  La lista es ampliable: anadir un codigo aqui basta para que vete.
# --------------------------------------------------------------------------
critical_vetoes:
  enabled: true
  codes:
    - honeypot                 # no se puede vender
    - blacklist_function       # pueden bloquear tu direccion
    - mint_authority_active    # pueden crear suministro y diluirte
    - freeze_authority_active  # pueden congelar tus tokens
    - liquidity_removed        # ya han retirado liquidez
    - no_operable              # el impacto en el precio hace imposible operar
    - sin_ruta_de_venta        # Jupiter no encuentra forma de vender (Solana)

# --------------------------------------------------------------------------
#  EVALUABILIDAD
#
#  "No lo se" es una respuesta valida. Si faltan comprobaciones criticas, el
#  token NO se envia como oportunidad: se marca como NO EVALUABLE.
# --------------------------------------------------------------------------
evaluability:
  enabled: true
  # Comprobaciones sin las cuales no se puede afirmar que un token es seguro.
  required:
    - analisis de seguridad
    - estado de la liquidez (bloqueada o quemada)
  # Si faltan mas de N comprobaciones de cualquier tipo, tampoco es evaluable.
  max_missing: 3

# --------------------------------------------------------------------------
#  SEMAFORO
#  VERDE = valida · AMARILLO = vigilar · ROJO = condicion critica
# --------------------------------------------------------------------------
traffic_light:
  amarillo_desde_riesgo: 45
  rojo_desde_riesgo: 70
